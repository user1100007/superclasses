var KH_DIGITS = ["០","១","២","៣","៤","៥","៦","៧","៨","៩"];





function toKh(n){ return String(n).split("").map(function(c){ return /[0-9]/.test(c) ? KH_DIGITS[c] : c; }).join(""); }

var KH_WEEKDAYS_LONG = ["ថ្ងៃអាទិត្យ","ថ្ងៃច័ន្ទ","ថ្ងៃអង្គារ","ថ្ងៃពុធ","ថ្ងៃព្រហស្បតិ៍","ថ្ងៃសុក្រ","ថ្ងៃសៅរ៍"];


var KH_MONTHS_SOLAR = ["មករា","កុម្ភៈ","មីនា","មេសា","ឧសភា","មិថុនា","កក្កដា","សីហា","កញ្ញា","តុលា","វិច្ឆិកា","ធ្នូ"];


var KH_MONTHS_LUNAR = {0:"មាឃ",1:"ផល្គុន",2:"ចេត្រ",3:"ពិសាខ",4:"ជេស្ឋ",5:"អាសាឍ",6:"ស្រាពណ៍",7:"ភទ្របទ",8:"អស្សុជ",9:"កត្តិក",10:"មិគសិរ",11:"បុស្ស"};


var KH_ANIMALS = ["ជូត","ឆ្លូវ","ខាល","ថោះ","រោង","ម្សាញ់","មមី","មមែ","វក","រកា","ច","កុរ"];


var KH_SAK = ["សំរឹទ្ធិស័ក","ឯកស័ក","ទោស័ក","ត្រីស័ក","ចត្វាស័ក","បញ្ចស័ក","ឆស័ក","សប្តស័ក","អដ្ឋស័ក","នព្វស័ក"];





function rptSolarDateStr(d){


  return "ថ្ងៃទី" + toKh(d.getDate()) + " ខែ" + KH_MONTHS_SOLAR[d.getMonth()] + " ឆ្នាំ" + toKh(d.getFullYear());


}





function rptLunarDateStr(d){


  var base = new Date("2026-05-13"),


      diff = Math.round((d - base) / 86400000);


  var ld = (9 + diff) % 30 || 30;


  if (ld <= 0) ld += 30;


  var phase = ld <= 15 ? "កើត" : "រោច",


      pn = ld <= 15 ? ld : (ld - 15 || 15);


  var lm = KH_MONTHS_LUNAR[d.getMonth()];


  var afterKhmerNewYear = d.getMonth() > 3 || (d.getMonth() === 3 && d.getDate() >= 14);


  var cs = afterKhmerNewYear ? d.getFullYear() - 638 : d.getFullYear() - 639;


  var be = cs + 1182;


  var animalName = KH_ANIMALS[(((cs % 12) + 12) % 12 + 10) % 12];


  var sakName = KH_SAK[((cs % 10) + 10) % 10];


  return KH_WEEKDAYS_LONG[d.getDay()] + " " + toKh(pn) + phase + " ខែ" + lm + " ឆ្នាំ" + animalName + " " + sakName + " ព.ស " + toKh(be);


}

  var gt1 = document.getElementById('rpt-detail-grandtotal');

function rptClassifyDay(rec){





  if (!rec) return null;





  var hasSigned = (rec.m_in && rec.m_in.sig) || (rec.a_in && rec.a_in.sig);





  if (hasSigned) return 'present';





  var note = (rec.note || '').trim();





  if (note.indexOf('អត់ច្បាប់') !== -1) return 'noleave';





  if (note.indexOf('ច្បាប់') !== -1) return 'leave';





  if (note.length > 0) return 'other';





  return 'noleave';





}

			function khmerSolarDateStr(d) {





				return (





					"ថ្ងៃទី" +





					toKhmer(d.getDate()) +





					" ខែ" +





					KH_MONTHS_SOLAR[d.getMonth()] +

			function khmerLunarDateStr(d) {





				var base = new Date("2026-05-13"),





					diff = Math.round((d - base) / 86400000);





				var ld = (9 + diff) % 30 || 30;





				if (ld <= 0) ld += 30;





				var phase = ld <= 15 ? "កើត" : "រោច",





					pn = ld <= 15 ? ld : ld - 15 || 15;





				var lm = KH_MONTHS_LUNAR[d.getMonth()];











				// ចុល្លសករាជ / ព.ស / ឆ្នាំសត្វ / ស័ក — គណនាតាមថ្ងៃឆ្នាំថ្មីខ្មែរ (~១៤មេសា)





				var afterKhmerNewYear =





					d.getMonth() > 3 ||





					(d.getMonth() === 3 && d.getDate() >= 14);





				var cs = afterKhmerNewYear





					? d.getFullYear() - 638





					: d.getFullYear() - 639;





				var be = cs + 1182;





				var animalName = KH_ANIMALS[(((cs % 12) + 12) % 12 + 10) % 12];





				var sakName = KH_SAK[((cs % 10) + 10) % 10];











				return (





					KH_WEEKDAYS_LONG[d.getDay()] +





					" " +





					toKhmer(pn) +





					phase +





					" ខែ" +





					lm +





					" ឆ្នាំ" +





					animalName +





					" " +





					sakName +





					" ព.ស " +





					toKhmer(be)





				);





			}

			function updateAttendanceStats() {





				var leaveCount = 0, leaveFemaleCount = 0;





				var noleaveCount = 0, noleaveFemaleCount = 0;





				var missionCount = 0, missionFemaleCount = 0;





				var otherCount = 0, otherFemaleCount = 0;











				document





					.querySelectorAll("#att-tbody tr")





					.forEach(function (tr) {





						var idx = tr.dataset.idx;





						var s = attStaff[idx];





						if (!s) return;











						var cs = tr.querySelectorAll(".att-sig-container");





						var noteInput = tr.querySelector("input.att-note");





						var noteValue = noteInput ? noteInput.value.trim() : "";











						var hasSigned =





							cs[0].dataset.sigData || cs[2].dataset.sigData;





						var isFemale = s.gender === "ស្រី" || s.gender === "F";











						if (hasSigned) return; // មកធ្វើការ — មិនរាប់ជាអវត្តមាន











						if (noteValue.indexOf("អត់ច្បាប់") !== -1) {





							noleaveCount++;





							if (isFemale) noleaveFemaleCount++;





						} else if (noteValue.indexOf("ច្បាប់") !== -1) {





							leaveCount++;





							if (isFemale) leaveFemaleCount++;





						} else if (





							noteValue.indexOf("បេសកកម្ម") !== -1 ||





							noteValue.toLowerCase().indexOf("mission") !== -1





						) {





							missionCount++;





							if (isFemale) missionFemaleCount++;





						} else if (noteValue.length > 0) {





							otherCount++;





							if (isFemale) otherFemaleCount++;





						} else {





							// គ្មានកំណត់ចំណាំ = អត់ច្បាប់ ដោយស្វ័យប្រវត្តិ





							noleaveCount++;





							if (isFemale) noleaveFemaleCount++;





						}





					});











				var absentCount =





					leaveCount + noleaveCount + missionCount + otherCount;











				function fmt(count, femaleCount, colorCls) {





					return (





						toKhmer(String(count).padStart(2, "0")) +





						' <span class="text-xs ' + colorCls + '">(ស្រី: ' +





						toKhmer(femaleCount) +





						")</span>"





					);





				}











				var leaveEl = document.getElementById("att-stat-leave");





				var noleaveEl = document.getElementById("att-stat-noleave");





				var missionEl = document.getElementById("att-stat-mission");





				var otherEl = document.getElementById("att-stat-other");





				var absentEl = document.getElementById("att-stat-absent");











				if (leaveEl) leaveEl.innerHTML = fmt(leaveCount, leaveFemaleCount, "text-orange-400");





				if (noleaveEl) noleaveEl.innerHTML = fmt(noleaveCount, noleaveFemaleCount, "text-red-400");





				if (missionEl) missionEl.innerHTML = fmt(missionCount, missionFemaleCount, "text-blue-400");





				if (otherEl) otherEl.innerHTML = fmt(otherCount, otherFemaleCount, "text-slate-400");





				if (absentEl)





					absentEl.innerHTML = toKhmer(String(absentCount).padStart(2, "0"));





			}

					attCtx.beginPath();





					var p = attGetCanvasPos(e);





					attCtx.moveTo(p.x, p.y);





					canvas.setPointerCapture(e.pointerId);





				};











				canvas.onpointermove = function (e) {





					if (!attDrawing || !attCtx) return;





					var p = attGetCanvasPos(e);





					attCtx.lineTo(p.x, p.y);





					attCtx.stroke();





				};











				canvas.onpointerup = function (e) {





					attDrawing = false;





					canvas.releasePointerCapture(e.pointerId);





				};





				canvas.onpointerleave = function () {





					attDrawing = false;





				};

					showGPSError();





					attCloseModal();

					String(now.getMinutes()).padStart(2, "0") +





					":" +





					String(now.getSeconds()).padStart(2, "0");

			function attGetCanvasPos(e) {





				var canvasEl = document.getElementById("att-sig-canvas");





				var rect = canvasEl.getBoundingClientRect();





				var cx = e.touches ? e.touches[0].clientX : e.clientX;





				var cy = e.touches ? e.touches[0].clientY : e.clientY;





				return { x: cx - rect.left, y: cy - rect.top };





			}

        'sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>';





    var iframe = cont.querySelector('iframe');

    ['attendance','appfinall','efms','standard','library','report','dataclass','payment'].forEach(function(id) {





        var el = document.getElementById('tab-' + id);





        if (!el) return;





        el.style.borderBottom = id === tabId ? '2px solid #f59e0b' : '2px solid transparent';





        el.style.color = id === tabId ? '#f59e0b' : '#94a3b8';





    });











    if      (tabId === 'attendance') renderAttendance();





    else if (tabId === 'appfinall')     window.renderAppfinall();





    else if (tabId === 'efms')     window.renderEfms();





    else if (tabId === 'standard')   window.renderStandard();





    else if (tabId === 'library')    window.renderLibrary();





    else if (tabId === 'report')     window.renderReport();





    else if (tabId === 'dataclass')  window.renderDataclass();





    else if (tabId === 'payment')  window.renderPayment();





}
